<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch pha chế</title>
    <link rel="stylesheet" href="nhanvien-style.css">
</head>
<body>
    <h1>Đăng kí làm việc Pha chế</h1>

    <table class="table-nhanvien">
        <!-- Phần tiêu đề các ngày trong tuần -->
        <thead>
            <tr>
                <th>Thứ Hai</th>
                <th>Thứ Ba</th>
                <th>Thứ Tư</th>
                <th>Thứ Năm</th>
                <th>Thứ Sáu</th>
                <th>Thứ Bảy</th>
                <th>Chủ Nhật</th>
            </tr>
        </thead>
        <!-- Phần nội dung lịch làm -->
        <tbody>
            <!-- --- Hàng của PHA CHẾ --- -->
            <tr class="pha-che">
                <td data-ngay = "thu-hai" data-ca="sang-pc"></td>
                <td data-ngay = "thu-ba" data-ca="sang-pc"></td>
                <td data-ngay = "thu-tu" data-ca="sang-pc"></td>
                <td data-ngay = "thu-nam" data-ca="sang-pc"></td>
                <td data-ngay = "thu-sau" data-ca="sang-pc"></td>
                <td data-ngay = "thu-bay" data-ca="sang-pc"></td>
                <td data-ngay = "chu-nhat" data-ca="sang-pc"></td>
                <th class="thongtinca">CA SÁNG 6H30 - 12H</th>
            </tr>
            <tr class="pha-che">
                <td data-ngay = "thu-hai" data-ca="chieu-pc"></td>
                <td data-ngay = "thu-ba" data-ca="chieu-pc"></td>
                <td data-ngay = "thu-tu" data-ca="chieu-pc"></td>
                <td data-ngay = "thu-nam" data-ca="chieu-pc"></td>
                <td data-ngay = "thu-sau" data-ca="chieu-pc"></td>
                <td data-ngay = "thu-bay" data-ca="chieu-pc"></td>
                <td data-ngay = "chu-nhat" data-ca="chieu-pc"></td>
                <th class="thongtinca">CA CHIỀU 12H - 18H</th>
            </tr>
            <tr class="pha-che">
                <td data-ngay = "thu-hai" data-ca="toi-pc"></td>
                <td data-ngay = "thu-ba" data-ca="toi-pc"></td>
                <td data-ngay = "thu-tu" data-ca="toi-pc"></td>
                <td data-ngay = "thu-nam" data-ca="toi-pc"></td>
                <td data-ngay = "thu-sau" data-ca="toi-pc"></td>
                <td data-ngay = "thu-bay" data-ca="toi-pc"></td>
                <td data-ngay = "chu-nhat" data-ca="toi-pc"></td>
                <th class="thongtinca">CA TỐI 18H - 22H</th>
            </tr>
    </table>
    <button class="submit-button">Xác nhận</button>
    <a href="index.html" class="home">Trang chủ</a>
    <script src="nhanvien-interactive.js" defer></script>
</body>
</html>
