<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c140e" />
      <stop offset="100%" stop-color="#0a0806" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />
  <circle cx="400" cy="220" r="280" fill="url(#glow)" />

  <!-- Center Emblem Container -->
  <g transform="translate(400, 210)">
    <!-- Ambient Ring -->
    <circle cx="0" cy="0" r="85" fill="#18181b" fill-opacity="0.7" stroke="#27272a" stroke-width="1.5" />
    <circle cx="0" cy="0" r="75" fill="#09090b" fill-opacity="0.9" stroke="#f97316" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Icon -->
    <g transform="translate(-40, -40) scale(3.33)">
      <path d="M13.8 2.5h-3.6l-6 19h4.3l1.4-4.5h4.2l1.4 4.5h4.3l-6-19zm-3.1 11.2l1.3-4.4 1.3 4.4h-2.6z" fill="#f97316" />
    </g>
  </g>

  <!-- Text Badges -->
  <g transform="translate(400, 385)" text-anchor="middle">
    <!-- Brand Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1">CLAUDE AI</text>
    
    <!-- Subtitle Pill -->
    <g transform="translate(0, 32)">
      <text font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="600" fill="#f97316" letter-spacing="1.5">ANTHROPIC 3.5 SONNET • API</text>
    </g>
  </g>
</svg>