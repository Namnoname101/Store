<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="gptBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#0b241c"/>
      <stop offset="55%" stop-color="#04120e"/>
      <stop offset="100%" stop-color="#010504"/>
    </radialGradient>
    <filter id="gptGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="gptCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="gptEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#gptBg)"/>

  <!-- Subtle Matrix grid lines -->
  <g opacity="0.12" stroke="#10a37f" stroke-width="1">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
  </g>

  <!-- Glow Aura -->
  <circle cx="600" cy="290" r="240" fill="#10a37f" opacity="0.22" filter="url(#gptGlow)"/>

  <!-- Center Card -->
  <rect x="220" y="80" width="760" height="640" rx="44" fill="url(#gptCard)" stroke="#10a37f" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Feature Tags -->
  <g transform="translate(290, 140)">
    <rect width="150" height="38" rx="19" fill="#10a37f" fill-opacity="0.2" stroke="#10a37f" stroke-width="1.5"/>
    <text x="75" y="24" fill="#2dd4bf" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">⚡ GPT-4O &amp; O1 PRO</text>
  </g>
  <g transform="translate(760, 140)">
    <rect width="150" height="38" rx="19" fill="#10a37f" fill-opacity="0.2" stroke="#10a37f" stroke-width="1.5"/>
    <text x="75" y="24" fill="#2dd4bf" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">🎨 DALL·E 3 &amp; CANVAS</text>
  </g>

  <!-- ================= AUTHENTIC OPENAI ROSETTE ================= -->
  <g transform="translate(600, 290)">
    <!-- Outer ambient ring -->
    <circle cx="0" cy="0" r="110" fill="#03140e" stroke="#10a37f" stroke-width="3.5" filter="url(#gptGlow)"/>
    <circle cx="0" cy="0" r="95" fill="#010a07" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Exact Official OpenAI Rosette Path -->
    <g transform="translate(-56, -56) scale(4.66)">
      <path d="M9.205 8.658v-2.26c0-.19.072-.333.238-.428l4.543-2.616c.619-.357 1.356-.523 2.117-.523 2.854 0 4.662 2.212 4.662 4.566 0 .167 0 .357-.024.547l-4.71-2.759a.797.797 0 00-.856 0l-5.97 3.473zm10.609 8.8V12.06c0-.333-.143-.57-.429-.737l-5.97-3.473 1.95-1.118a.433.433 0 01.476 0l4.543 2.617c1.309.76 2.189 2.378 2.189 3.948 0 1.808-1.07 3.473-2.76 4.163zM7.802 12.703l-1.95-1.142c-.167-.095-.239-.238-.239-.428V5.899c0-2.545 1.95-4.472 4.591-4.472 1 0 1.927.333 2.712.928L8.23 5.067c-.285.166-.428.404-.428.737v6.898zM12 15.128l-2.795-1.57v-3.33L12 8.658l2.795 1.57v3.33L12 15.128zm1.796 7.23c-1 0-1.927-.332-2.712-.927l4.686-2.712c.285-.166.428-.404.428-.737v-6.898l1.974 1.142c.167.095.238.238.238.428v5.233c0 2.545-1.974 4.472-4.614 4.472zm-5.637-5.303l-4.544-2.617c-1.308-.761-2.188-2.378-2.188-3.948A4.482 4.482 0 014.21 6.327v5.423c0 .333.143.571.428.738l5.947 3.449-1.95 1.118a.432.432 0 01-.476 0zm-.262 3.9c-2.688 0-4.662-2.021-4.662-4.519 0-.19.024-.38.047-.57l4.686 2.71c.286.167.571.167.856 0l5.97-3.448v2.26c0 .19-.07.333-.237.428l-4.543 2.616c-.619.357-1.356.523-2.117.523zm5.899 2.83a5.947 5.947 0 005.827-4.756C22.287 18.339 24 15.84 24 13.296c0-1.665-.713-3.282-1.998-4.448.119-.5.19-.999.19-1.498 0-3.401-2.759-5.947-5.946-5.947-.642 0-1.26.095-1.88.31A5.962 5.962 0 0010.205 0a5.947 5.947 0 00-5.827 4.757C1.713 5.447 0 7.945 0 10.49c0 1.666.713 3.283 1.998 4.448-.119.5-.19 1-.19 1.499 0 3.401 2.759 5.946 5.946 5.946.642 0 1.26-.095 1.88-.309a5.96 5.96 0 004.162 1.713z" fill="#10a37f" fill-rule="evenodd"/>
    </g>
  </g>
  <!-- ================= END OPENAI ROSETTE ================= -->

  <!-- Brand Typography -->
  <g transform="translate(600, 480)" text-anchor="middle">
    <!-- Plus Badge -->
    <rect x="-100" y="-18" width="200" height="34" rx="17" fill="url(#gptEmerald)"/>
    <text x="0" y="6" fill="#010a07" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="3">PLUS TÀI KHOẢN</text>

    <!-- Main Title -->
    <text x="0" y="58" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="1">
      CHATGPT PLUS 1 THÁNG
    </text>

    <!-- Subtitle -->
    <text x="0" y="94" fill="#2dd4bf" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" letter-spacing="2">
      TÀI KHOẢN RIÊNG TƯ • BẢO HÀNH ĐẦY ĐỦ
    </text>
  </g>

  <!-- Bottom CTA Strip -->
  <g transform="translate(380, 615)">
    <rect width="440" height="54" rx="27" fill="url(#gptEmerald)"/>
    <text x="220" y="34" fill="#02140d" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      CHỈ 199.000đ • CẤP MAIL DÙNG NGAY
    </text>
  </g>

  <!-- Store Footer -->
  <text x="600" y="760" fill="#10a37f" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle" opacity="0.8">
    KHODEE MMO HUB — HỆ THỐNG TRÍ TUỆ NHÂN TẠO 24/7
  </text>
</svg>