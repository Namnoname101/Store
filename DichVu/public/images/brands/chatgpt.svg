<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081714" />
      <stop offset="100%" stop-color="#020a08" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#10a37f" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10a37f" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />
  <circle cx="400" cy="220" r="280" fill="url(#glow)" />

  <!-- Center Emblem Container -->
  <g transform="translate(400, 210)">
    <!-- Ambient Ring -->
    <circle cx="0" cy="0" r="85" fill="#18181b" fill-opacity="0.7" stroke="#27272a" stroke-width="1.5" />
    <circle cx="0" cy="0" r="75" fill="#09090b" fill-opacity="0.9" stroke="#10a37f" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Icon -->
    <g transform="translate(-40, -40) scale(3.33)">
      <path d="M20.5 12.3c-.2-1.3-.9-2.4-2-3.1.2-.8.1-1.7-.3-2.4-.6-1.1-1.7-1.7-2.9-1.7-.5 0-1 .1-1.5.4C13 4.6 11.8 4 10.5 4c-1.8 0-3.3 1.2-3.8 2.9-.8.2-1.6.7-2.1 1.4-.8 1.1-.9 2.5-.4 3.7-1 .6-1.7 1.7-1.7 2.9 0 1.5.9 2.8 2.2 3.4-.1.8 0 1.7.5 2.4.6 1.1 1.7 1.7 2.9 1.7.5 0 1-.1 1.5-.4.8.9 2 1.5 3.3 1.5 1.8 0 3.3-1.2 3.8-2.9.8-.2 1.6-.7 2.1-1.4.8-1.1.9-2.5.4-3.7 1-.6 1.8-1.7 1.8-2.9 0-.1 0-.3-.1-.6z" stroke="#10a37f" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z" stroke="#10a37f" stroke-width="1.8" fill="none" />
    </g>
  </g>

  <!-- Text Badges -->
  <g transform="translate(400, 385)" text-anchor="middle">
    <!-- Brand Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1">CHATGPT PLUS</text>
    
    <!-- Subtitle Pill -->
    <g transform="translate(0, 32)">
      <text font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="600" fill="#10a37f" letter-spacing="1.5">OPENAI GPT-4O • CANVAS & DALLE-3</text>
    </g>
  </g>
</svg>