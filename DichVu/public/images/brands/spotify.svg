<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="b_spot_bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#072614"/>
      <stop offset="100%" stop-color="#010803"/>
    </radialGradient>
    <radialGradient id="b_spot_halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1ed760" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#1ed760" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#010803" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b_spot_corner" cx="88%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#1ed760" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#010803" stop-opacity="0"/>
    </radialGradient>
    <pattern id="b_spot_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.032"/>
    </pattern>
    <linearGradient id="b_spot_pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1ed760" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#1ed760" stop-opacity="0.16"/>
    </linearGradient>
    
  </defs>

  <!-- Full-bleed edge-to-edge backdrop (Zero inner box frame) -->
  <rect width="1200" height="750" fill="url(#b_spot_bg)"/>
  <rect width="1200" height="750" fill="url(#b_spot_grid)"/>
  <rect width="1200" height="750" fill="url(#b_spot_corner)"/>

  <!-- Atmospheric hero spotlight halo -->
  <circle cx="600" cy="240" r="295" fill="url(#b_spot_halo)"/>

  <!-- Enlarged hero brand emblem (Clear of corner overlay zones) -->
  <g transform="translate(600, 240)">
    <g transform="translate(-129.60000000000002, -129.60000000000002) scale(10.8)">
      <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm4.6 14.4c-.2.3-.5.4-.8.2-2.3-1.4-5.2-1.7-8.6-.9-.3.1-.7-.1-.8-.4-.1-.3.1-.7.4-.8 3.7-.8 6.9-.5 9.5 1.1.3.2.4.5.3.8zm1.2-2.7c-.2.4-.7.5-1.1.2-2.6-1.6-6.6-2.1-9.7-1.1-.4.1-.9-.1-1-.5-.1-.4.1-.9.5-1 3.5-1.1 7.9-.5 10.9 1.3.4.3.5.7.4 1.1zm.1-2.8C14.7 9 8.7 8.8 5.3 9.8c-.5.2-1.1-.1-1.2-.7-.2-.5.1-1.1.7-1.2 4-1.2 10.6-1 14.4 1.3.5.3.6.9.3 1.4-.3.5-.9.6-1.6.3z" fill="#1ed760"/>
    </g>
  </g>

  <!-- Large legible typography safely above bottom badge safe-zone -->
  <g transform="translate(600, 470)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="1.5">SPOTIFY PREMIUM</text>
    <g transform="translate(0, 62)">
      <rect x="-340" y="-28" width="680" height="56" rx="28" fill="url(#b_spot_pillGrad)" stroke="#1ed760" stroke-opacity="0.52" stroke-width="1.75"/>
      <text x="0" y="9" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="1">LOSSLESS • KHÔNG QUẢNG CÁO</text>
    </g>
  </g>
</svg>