<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="b_tt_bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#14101f"/>
      <stop offset="100%" stop-color="#030206"/>
    </radialGradient>
    <radialGradient id="b_tt_halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#ff0050" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#030206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b_tt_corner" cx="88%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#ff0050" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#030206" stop-opacity="0"/>
    </radialGradient>
    <pattern id="b_tt_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.032"/>
    </pattern>
    <linearGradient id="b_tt_pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff0050" stop-opacity="0.16"/>
    </linearGradient>
    
  </defs>

  <!-- Full-bleed edge-to-edge backdrop (Zero inner box frame) -->
  <rect width="1200" height="750" fill="url(#b_tt_bg)"/>
  <rect width="1200" height="750" fill="url(#b_tt_grid)"/>
  <rect width="1200" height="750" fill="url(#b_tt_corner)"/>

  <!-- Atmospheric hero spotlight halo -->
  <circle cx="600" cy="240" r="295" fill="url(#b_tt_halo)"/>

  <!-- Enlarged hero brand emblem (Clear of corner overlay zones) -->
  <g transform="translate(600, 240)">
    <g transform="translate(-129.60000000000002, -129.60000000000002) scale(10.8)">
      <path d="M19.5 7.4c-1.4-.1-2.6-.7-3.5-1.7V15c0 3.3-2.7 6-6 6s-6-2.7-6-6 2.7-6 6-6c.3 0 .7 0 1 .1v3.2c-.3-.1-.7-.1-1-.1-1.7 0-3 1.3-3 3s1.3 3 3 3 3-1.3 3-3V2h3.3c.3 2 1.8 3.6 3.8 3.9v1.5z" fill="#00f2fe"/>
    </g>
  </g>

  <!-- Large legible typography safely above bottom badge safe-zone -->
  <g transform="translate(600, 470)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="1.5">TIKTOK VIP</text>
    <g transform="translate(0, 62)">
      <rect x="-340" y="-28" width="680" height="56" rx="28" fill="url(#b_tt_pillGrad)" stroke="#00f2fe" stroke-opacity="0.52" stroke-width="1.75"/>
      <text x="0" y="9" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="1">FOLLOW • LIKE • VIEW TỰ ĐỘNG</text>
    </g>
  </g>
</svg>