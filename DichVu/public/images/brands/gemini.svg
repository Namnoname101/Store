<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="b_gem_bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#170e38"/>
      <stop offset="100%" stop-color="#03010a"/>
    </radialGradient>
    <radialGradient id="b_gem_halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#03010a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b_gem_corner" cx="88%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#03010a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="b_gem_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.032"/>
    </pattern>
    <linearGradient id="b_gem_pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="b_gem_gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed edge-to-edge backdrop (Zero inner box frame) -->
  <rect width="1200" height="750" fill="url(#b_gem_bg)"/>
  <rect width="1200" height="750" fill="url(#b_gem_grid)"/>
  <rect width="1200" height="750" fill="url(#b_gem_corner)"/>

  <!-- Atmospheric hero spotlight halo -->
  <circle cx="600" cy="240" r="295" fill="url(#b_gem_halo)"/>

