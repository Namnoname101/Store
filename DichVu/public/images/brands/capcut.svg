<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="b_cc_bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#140b2e"/>
      <stop offset="100%" stop-color="#030208"/>
    </radialGradient>
    <radialGradient id="b_cc_halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#030208" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b_cc_corner" cx="88%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#030208" stop-opacity="0"/>
    </radialGradient>
    <pattern id="b_cc_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.032"/>
    </pattern>
    <linearGradient id="b_cc_pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="b_cc_vec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed edge-to-edge backdrop (Zero inner box frame) -->
  <rect width="1200" height="750" fill="url(#b_cc_bg)"/>
  <rect width="1200" height="750" fill="url(#b_cc_grid)"/>
  <rect width="1200" height="750" fill="url(#b_cc_corner)"/>

  <!-- Atmospheric hero spotlight halo -->
  <circle cx="600" cy="240" r="295" fill="url(#b_cc_halo)"/>

  <!-- Enlarged hero brand emblem (Clear of corner overlay zones) -->
  <g transform="translate(600, 240)">
    <g transform="translate(-139, -124) scale(11.5)">
      <path d="M24.189 6.442V2.671l-4.535 2.383V4.91c.002-1.505-1.078-2.411-2.638-2.411H2.64C.993 2.5 0 3.407 0 4.91V8.72L6.354 12 0 15.316v3.8C0 20.595 1 21.5 2.64 21.5h14.373c1.56 0 2.639-.907 2.639-2.382v-.197l4.536 2.409v-3.828L13.64 12 24.19 6.443zM9.982 13.873l7.797 4.083H2.157l7.825-4.083zm7.741-7.828l-7.742 4.057-7.825-4.057h15.567z" fill="url(#b_cc_vec)" fill-rule="evenodd"/>
    </g>
  </g>

  <!-- Large legible typography safely above bottom badge safe-zone -->
  <g transform="translate(600, 470)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="1.5">CAPCUT PRO</text>
    <g transform="translate(0, 62)">
      <rect x="-340" y="-28" width="680" height="56" rx="28" fill="url(#b_cc_pillGrad)" stroke="#00f2fe" stroke-opacity="0.52" stroke-width="1.75"/>
      <text x="0" y="9" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="1">XUẤT 4K 60FPS • PHỤ ĐỀ &amp; AI</text>
    </g>
  </g>
</svg>