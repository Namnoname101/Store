<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="ccBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#140b29"/>
      <stop offset="55%" stop-color="#080414"/>
      <stop offset="100%" stop-color="#020008"/>
    </radialGradient>
    <filter id="ccGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="ccGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ccCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#ccBg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.1" stroke="#00f2fe" stroke-width="1">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
  </g>

  <!-- Glow Aura -->
  <circle cx="600" cy="285" r="240" fill="#00f2fe" opacity="0.2" filter="url(#ccGlow)"/>

  <!-- Center Card -->
  <rect x="220" y="80" width="760" height="640" rx="44" fill="url(#ccCard)" stroke="#00f2fe" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Feature Tags -->
  <g transform="translate(290, 140)">
    <rect width="155" height="38" rx="19" fill="#00f2fe" fill-opacity="0.2" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="77" y="24" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">⚡ XUẤT 4K 60FPS</text>
  </g>
  <g transform="translate(755, 140)">
    <rect width="155" height="38" rx="19" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.5"/>
    <text x="77" y="24" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">🤖 PHỤ ĐỀ &amp; HIỆU ỨNG AI</text>
  </g>

  <!-- ================= AUTHENTIC CAPCUT LOGO ================= -->
  <g transform="translate(600, 285)">
    <!-- Outer ambient ring -->
    <circle cx="0" cy="0" r="110" fill="#060212" stroke="url(#ccGrad)" stroke-width="3" filter="url(#ccGlow)"/>

    <!-- Exact Official Capcut Cutters Logo Path -->
    <g transform="translate(-60, -60) scale(4.96)">
      <path d="M24.189 6.442V2.671l-4.535 2.383V4.91c.002-1.505-1.078-2.411-2.638-2.411H2.64C.993 2.5 0 3.407 0 4.91V8.72L6.354 12 0 15.316v3.8C0 20.595 1 21.5 2.64 21.5h14.373c1.56 0 2.639-.907 2.639-2.382v-.197l4.536 2.409v-3.828L13.64 12 24.19 6.443zM9.982 13.873l7.797 4.083H2.157l7.825-4.083zm7.741-7.828l-7.742 4.057-7.825-4.057h15.567z" fill="url(#ccGrad)" fill-rule="evenodd"/>
    </g>
  </g>
  <!-- ================= END CAPCUT LOGO ================= -->

  <!-- Brand Typography -->
  <g transform="translate(600, 480)" text-anchor="middle">
    <!-- Pro Badge -->
    <rect x="-100" y="-18" width="200" height="34" rx="17" fill="url(#ccGrad)"/>
    <text x="0" y="6" fill="#03010a" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="3">CAPCUT PRO</text>

    <!-- Main Title -->
    <text x="0" y="58" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="1">
      TÀI KHOẢN CAPCUT PRO
    </text>

    <!-- Subtitle -->
    <text x="0" y="94" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" letter-spacing="2">
      GÓI 1 THÁNG / 6 THÁNG • ĐĂNG NHẬP 2 THIẾT BỊ
    </text>
  </g>

  <!-- Bottom CTA Strip -->
  <g transform="translate(380, 615)">
    <rect width="440" height="54" rx="27" fill="url(#ccGrad)"/>
    <text x="220" y="34" fill="#04020d" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      GIÁ TỪ 75.000đ • BẢO HÀNH ĐẦY ĐỦ
    </text>
  </g>

  <!-- Store Footer -->
  <text x="600" y="760" fill="#00f2fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle" opacity="0.8">
    KHODEE MMO HUB — EDIT VIDEO CHUYÊN NGHIỆP TIKTOK / REELS
  </text>
</svg>