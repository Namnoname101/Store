<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="duoBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#142e09"/>
      <stop offset="55%" stop-color="#081404"/>
      <stop offset="100%" stop-color="#020501"/>
    </radialGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="duoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Super Rainbow Gradient -->
    <linearGradient id="superGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="25%" stop-color="#ff9600"/>
      <stop offset="50%" stop-color="#ffc800"/>
      <stop offset="75%" stop-color="#2b70c9"/>
      <stop offset="100%" stop-color="#ce82ff"/>
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="50%" stop-color="#ffc800"/>
      <stop offset="100%" stop-color="#e59b00"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="duoCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="1200" height="800" fill="url(#duoBg)"/>

  <!-- Ambient Green Aura -->
  <circle cx="600" cy="300" r="260" fill="#58cc02" opacity="0.22" filter="url(#duoGlow)"/>

  <!-- Center Glass Card -->
  <rect x="220" y="80" width="760" height="640" rx="44" fill="url(#duoCard)" stroke="#58cc02" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Top Badges -->
  <g transform="translate(290, 140)">
    <rect width="165" height="38" rx="19" fill="#58cc02" fill-opacity="0.2" stroke="#58cc02" stroke-width="1.5"/>
    <text x="82" y="24" fill="#78c800" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">❤️ TRÁI TIM VÔ HẠN</text>
  </g>
  <g transform="translate(745, 140)">
    <rect width="165" height="38" rx="19" fill="#ffc800" fill-opacity="0.2" stroke="#ffc800" stroke-width="1.5"/>
    <text x="82" y="24" fill="#ffd900" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">👑 BẢN QUYỀN 1 NĂM</text>
  </g>

  <!-- ================= AUTHENTIC DUO OWl MASCOT ================= -->
  <g transform="translate(600, 310)">
    <!-- Owl Body Outer Glow Ring -->
    <ellipse cx="0" cy="0" rx="120" ry="115" fill="#0c1d05" stroke="#58cc02" stroke-width="3" filter="url(#duoGlow)"/>

    <!-- Duo Body (Classic Green) -->
    <ellipse cx="0" cy="0" rx="112" ry="105" fill="#58cc02"/>

    <!-- Belly/Face Mask (Light Green) -->
    <path d="M-65,25 Q0,75 65,25 Q85,-35 45,-65 Q0,-80 -45,-65 Q-85,-35 -65,25 Z" fill="#78c800"/>

    <!-- Left Wing -->
    <path d="M-110,-10 C-135,15 -125,60 -95,75 C-90,50 -95,15 -110,-10 Z" fill="#46a302"/>
    <!-- Right Wing -->
    <path d="M110,-10 C135,15 125,60 95,75 C90,50 95,15 110,-10 Z" fill="#46a302"/>

    <!-- Left Eye Ring & Eye -->
    <ellipse cx="-44" cy="-18" rx="34" ry="34" fill="#ffffff"/>
    <circle cx="-38" cy="-18" r="18" fill="#4b4b4b"/>
    <circle cx="-33" cy="-22" r="7" fill="#ffffff"/>

    <!-- Right Eye Ring & Eye -->
    <ellipse cx="44" cy="-18" rx="34" ry="34" fill="#ffffff"/>
    <circle cx="38" cy="-18" r="18" fill="#4b4b4b"/>
    <circle cx="43" cy="-22" r="7" fill="#ffffff"/>

    <!-- Orange Beak -->
    <polygon points="-16,-6 16,-6 0,22" fill="#ff9600"/>
    <polygon points="-12,-6 12,-6 0,16" fill="#ffc800"/>

    <!-- Orange Feet -->
    <ellipse cx="-35" cy="102" rx="18" ry="10" fill="#ff9600"/>
    <ellipse cx="35" cy="102" rx="18" ry="10" fill="#ff9600"/>

    <!-- Super Golden Crown on Duo's Head -->
    <g transform="translate(0, -96)">
      <polygon points="-40,15 -25,-18 -10,0 0,-25 10,0 25,-18 40,15" fill="url(#goldGrad)" stroke="#e59b00" stroke-width="2"/>
      <circle cx="-25" cy="-18" r="4" fill="#ffffff"/>
      <circle cx="0" cy="-25" r="5" fill="#ffffff"/>
      <circle cx="25" cy="-18" r="4" fill="#ffffff"/>
      <rect x="-38" y="14" width="76" height="8" rx="4" fill="#e59b00"/>
    </g>
  </g>
  <!-- ================= END DUO MASCOT ================= -->

  <!-- Brand Typography -->
  <g transform="translate(600, 485)" text-anchor="middle">
    <!-- Super Rainbow Pill Badge -->
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="url(#superGrad)"/>
    <text x="0" y="7" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" letter-spacing="4">SUPER</text>

    <!-- Main Title -->
    <text x="0" y="58" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="1">
      DUOLINGO SUPER
    </text>

    <!-- Subtitle -->
    <text x="0" y="94" fill="#78c800" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" letter-spacing="2">
      GÓI CHÍNH CHỦ 12 THÁNG • LUYỆN NÓI AI
    </text>
  </g>

  <!-- Bottom Price & CTA Strip -->
  <g transform="translate(380, 615)">
    <rect width="440" height="54" rx="27" fill="#58cc02"/>
    <text x="220" y="34" fill="#041202" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      CHỈ 45.000đ • KÍCH HOẠT TỰ ĐỘNG
    </text>
  </g>

  <!-- Store Footer -->
  <text x="600" y="760" fill="#58cc02" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle" opacity="0.8">
    KHODEE MMO HUB — HỌC NGOẠI NGỮ KHÔNG GIỚI HẠN
  </text>
</svg>