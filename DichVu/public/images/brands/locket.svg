<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="b_locket_bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#261b08"/>
      <stop offset="100%" stop-color="#060401"/>
    </radialGradient>
    <radialGradient id="b_locket_halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#060401" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b_locket_corner" cx="88%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#060401" stop-opacity="0"/>
    </radialGradient>
    <pattern id="b_locket_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.032"/>
    </pattern>
    <linearGradient id="b_locket_pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.16"/>
    </linearGradient>
    
  </defs>

  <!-- Full-bleed edge-to-edge backdrop (Zero inner box frame) -->
  <rect width="1200" height="750" fill="url(#b_locket_bg)"/>
  <rect width="1200" height="750" fill="url(#b_locket_grid)"/>
  <rect width="1200" height="750" fill="url(#b_locket_corner)"/>

  <!-- Atmospheric hero spotlight halo -->
  <circle cx="600" cy="240" r="295" fill="url(#b_locket_halo)"/>

  <!-- Enlarged hero brand emblem (Clear of corner overlay zones) -->
  <g transform="translate(600, 240)">
    <g transform="translate(-120, -120) scale(10)" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="8" width="18" height="13" rx="3" fill="#f59e0b" fill-opacity="0.22"/>
      <path d="M7 8V6a5 5 0 0 1 10 0v2"/>
      <path d="M12 13v3"/>
    </g>
  </g>

  <!-- Large legible typography safely above bottom badge safe-zone -->
  <g transform="translate(600, 470)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="1.5">LOCKET GOLD</text>
    <g transform="translate(0, 62)">
      <rect x="-340" y="-28" width="680" height="56" rx="28" fill="url(#b_locket_pillGrad)" stroke="#f59e0b" stroke-opacity="0.52" stroke-width="1.75"/>
      <text x="0" y="9" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="1">FULL HUY HIỆU • MỞ KHÓA PRO</text>
    </g>
  </g>
</svg>