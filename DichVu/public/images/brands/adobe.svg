<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="b_adobe_bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#2a060a"/>
      <stop offset="100%" stop-color="#060102"/>
    </radialGradient>
    <radialGradient id="b_adobe_halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FA0F00" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#FA0F00" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#060102" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b_adobe_corner" cx="88%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#FA0F00" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#060102" stop-opacity="0"/>
    </radialGradient>
    <pattern id="b_adobe_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.032"/>
    </pattern>
    <linearGradient id="b_adobe_pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FA0F00" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FA0F00" stop-opacity="0.16"/>
    </linearGradient>
    
  </defs>

  <!-- Full-bleed edge-to-edge backdrop (Zero inner box frame) -->
  <rect width="1200" height="750" fill="url(#b_adobe_bg)"/>
  <rect width="1200" height="750" fill="url(#b_adobe_grid)"/>
  <rect width="1200" height="750" fill="url(#b_adobe_corner)"/>

  <!-- Atmospheric hero spotlight halo -->
  <circle cx="600" cy="240" r="295" fill="url(#b_adobe_halo)"/>

  <!-- Enlarged hero brand emblem (Clear of corner overlay zones) -->
  <g transform="translate(600, 240)">
    <g transform="translate(-136, -116) scale(2.0)">
      <path fill="#FA0F00" d="M48.787 88.855h19.82c-.09.105 8.617 20.771 8.617 20.967h18.385c.025.055-28.025-63.931-28.151-64.057C67.736 45.55 48.967 88.908 48.787 88.855zM7.71 6.471C7.755 6.398 7.854 109.536 7.854 109.68 7.997 109.814 50.923 6.444 50.798 6.471H7.71zM83.599 6.471c0 0 44.55 103.595 44.522 103.263 0 .144.03-103.003.03-103.263H83.599z"/>
    </g>
  </g>

  <!-- Large legible typography safely above bottom badge safe-zone -->
  <g transform="translate(600, 470)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="1.5">ADOBE CREATIVE CLOUD</text>
    <g transform="translate(0, 62)">
      <rect x="-340" y="-28" width="680" height="56" rx="28" fill="url(#b_adobe_pillGrad)" stroke="#FA0F00" stroke-opacity="0.52" stroke-width="1.75"/>
      <text x="0" y="9" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="1">PHOTOSHOP • AI • FIREFLY AI</text>
    </g>
  </g>
</svg>