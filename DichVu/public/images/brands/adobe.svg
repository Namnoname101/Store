<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="abBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#200508" />
      <stop offset="100%" stop-color="#0a0203" />
    </linearGradient>
    <radialGradient id="abGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#FA0F00" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FA0F00" stop-opacity="0" />
    </radialGradient>
    <pattern id="abGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#abBg)" />
  <rect width="800" height="500" fill="url(#abGrid)" />
  <circle cx="400" cy="220" r="280" fill="url(#abGlow)" />

  <!-- Center Emblem Container -->
  <g transform="translate(400, 210)">
    <!-- Ambient Ring -->
    <circle cx="0" cy="0" r="85" fill="#18181b" fill-opacity="0.7" stroke="#27272a" stroke-width="1.5" />
    <circle cx="0" cy="0" r="75" fill="#FA0F00" fill-opacity="0.15" stroke="#FA0F00" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Authentic Official Adobe 'A' Vector in Squircle -->
    <g transform="translate(-48, -48)">
      <rect width="96" height="96" rx="22" fill="#FA0F00" />
      <g transform="translate(12, 12) scale(3)">
        <path d="M13.966 22.624l-1.69-4.281H8.122l3.892-9.144 5.662 13.425zM8.884 1.376H0v21.248zm15.116 0h-8.884L24 22.624Z" fill="#FFFFFF" />
      </g>
    </g>
  </g>

  <!-- Text Badges -->
  <g transform="translate(400, 385)" text-anchor="middle">
    <!-- Brand Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1">ADOBE CREATIVE CLOUD</text>
    
    <!-- Subtitle Pill -->
    <g transform="translate(0, 32)">
      <text font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="700" fill="#FF5252" letter-spacing="1.5">PHOTOSHOP • ILLUSTRATOR • PREMIERE • FIREFLY AI</text>
    </g>
  </g>
</svg>
