<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0c0e" />
      <stop offset="100%" stop-color="#080304" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />
  <circle cx="400" cy="220" r="280" fill="url(#glow)" />

  <!-- Center Emblem Container -->
  <g transform="translate(400, 210)">
    <!-- Ambient Ring -->
    <circle cx="0" cy="0" r="85" fill="#18181b" fill-opacity="0.7" stroke="#27272a" stroke-width="1.5" />
    <circle cx="0" cy="0" r="75" fill="#09090b" fill-opacity="0.9" stroke="#ff0000" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Icon -->
    <g transform="translate(-40, -40) scale(3.33)">
      <path d="M23.5 6.2c-.3-1-.9-1.8-1.9-2.1C19.9 3.5 12 3.5 12 3.5s-7.9 0-9.6.6c-1 .3-1.6 1.1-1.9 2.1C0 7.9 0 12 0 12s0 4.1.5 5.8c.3 1 .9 1.8 1.9 2.1 1.7.6 9.6.6 9.6.6s7.9 0 9.6-.6c1-.3 1.6-1.1 1.9-2.1.5-1.7.5-5.8.5-5.8s0-4.1-.5-5.8zM9.6 15.6V8.4l6.3 3.6-6.3 3.6z" fill="#ff0000" />
    </g>
  </g>

  <!-- Text Badges -->
  <g transform="translate(400, 385)" text-anchor="middle">
    <!-- Brand Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1">YOUTUBE PREMIUM</text>
    
    <!-- Subtitle Pill -->
    <g transform="translate(0, 32)">
      <text font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="600" fill="#ff0000" letter-spacing="1.5">NGHE NHẠC TẮT MÀN HÌNH • 4K</text>
    </g>
  </g>
</svg>