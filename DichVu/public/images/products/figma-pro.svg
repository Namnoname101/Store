<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="p_figma_bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#1d0e33"/>
      <stop offset="100%" stop-color="#040208"/>
    </radialGradient>
    <radialGradient id="p_figma_halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A259FF" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#1ABCFE" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#040208" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p_figma_corner" cx="88%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#1ABCFE" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#040208" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p_figma_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.032"/>
    </pattern>
    <linearGradient id="p_figma_pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A259FF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#1ABCFE" stop-opacity="0.16"/>
    </linearGradient>
    
  </defs>

  <!-- Full-bleed edge-to-edge backdrop (Zero inner box frame) -->
  <rect width="1200" height="750" fill="url(#p_figma_bg)"/>
  <rect width="1200" height="750" fill="url(#p_figma_grid)"/>
  <rect width="1200" height="750" fill="url(#p_figma_corner)"/>

  <!-- Atmospheric hero spotlight halo -->
  <circle cx="600" cy="240" r="295" fill="url(#p_figma_halo)"/>

  <!-- Enlarged hero brand emblem (Clear of corner overlay zones) -->
  <g transform="translate(600, 240)">
    <g transform="translate(-88, -132) scale(2.2)">
      <path d="M0 0 H40 V40 H20 A20 20 0 0 1 0 20 Z" fill="#F24E1E"/>
      <path d="M40 0 H60 A20 20 0 0 1 80 20 A20 20 0 0 1 60 40 H40 Z" fill="#FF7262"/>
      <path d="M0 40 H40 V80 H20 A20 20 0 0 1 0 60 Z" fill="#A259FF"/>
      <circle cx="60" cy="60" r="20" fill="#1ABCFE"/>
      <path d="M0 80 H40 V100 A20 20 0 0 1 20 120 A20 20 0 0 1 0 100 Z" fill="#0ACF83"/>
    </g>
  </g>

  <!-- Large legible typography safely above bottom badge safe-zone -->
  <g transform="translate(600, 470)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="1.5">FIGMA PRO EDU</text>
    <g transform="translate(0, 62)">
      <rect x="-340" y="-28" width="680" height="56" rx="28" fill="url(#p_figma_pillGrad)" stroke="#A259FF" stroke-opacity="0.52" stroke-width="1.75"/>
      <text x="0" y="9" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="1">FULL MAKE &amp; AI • BẢN QUYỀN</text>
    </g>
  </g>
</svg>