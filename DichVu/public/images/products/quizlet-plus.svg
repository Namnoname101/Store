<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="qzBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#0e1a38"/>
      <stop offset="55%" stop-color="#060b1c"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <filter id="qzGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="qzCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="qzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4257B2"/>
      <stop offset="50%" stop-color="#3CCFCF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#qzBg)"/>
  <circle cx="600" cy="260" r="270" fill="#3CCFCF" opacity="0.22" filter="url(#qzGlow)"/>
  <rect x="220" y="75" width="760" height="600" rx="36" fill="url(#qzCard)" stroke="#3CCFCF" stroke-opacity="0.38" stroke-width="1.5"/>

  <!-- Top Pill Badges -->
  <g transform="translate(256, 115)">
    <rect width="145" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="24" cy="18" r="6" fill="#3CCFCF"/>
    <text x="38" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Tài khoản</text>
  </g>
  <g transform="translate(865, 115)">
    <rect width="80" height="36" rx="18" fill="#FA0F00" fill-opacity="0.15" stroke="#FA0F00" stroke-opacity="0.35" stroke-width="1"/>
    <text x="40" y="23" fill="#ff6b6b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">-75%</text>
  </g>

  <!-- ================= AUTHENTIC QUIZLET OFFICIAL LOGO ================= -->
  <g transform="translate(600, 260)">
    <!-- App Tile Outer Glow -->
    <rect x="-105" y="-105" width="210" height="210" rx="48" fill="#081024" stroke="url(#qzGrad)" stroke-width="2.5" filter="url(#qzGlow)"/>
    <rect x="-105" y="-105" width="210" height="210" rx="48" fill="#081024"/>

    <!-- Exact Official Quizlet 'Q' Logo (Simple Icons Official Asset) -->
    <g transform="translate(-75, -75) scale(6.25)">
      <path d="M12.779.025a11.789 11.789 0 0 0-5.338.896A11.829 11.829 0 0 0 3.058 4.11 11.928 11.928 0 0 0 .427 14.363a11.92 11.92 0 0 0 2.3 4.921 11.842 11.842 0 0 0 4.24 3.378 11.783 11.783 0 0 0 10.533-.226.327.327 0 0 1 .331.018 9.136 9.136 0 0 0 5.197 1.545.332.332 0 0 0 .332-.332v-4.038a.334.334 0 0 0-.276-.331 4.732 4.732 0 0 1-1.106-.319.329.329 0 0 1-.191-.352.33.33 0 0 1 .05-.133 11.943 11.943 0 0 0 .772-11.871 11.87 11.87 0 0 0-4.042-4.628A11.793 11.793 0 0 0 12.765.018l.013.007h.001ZM4.843 11.898a7.24 7.24 0 0 1 1.205-4.005 7.18 7.18 0 0 1 3.215-2.657 7.133 7.133 0 0 1 7.815 1.558 7.239 7.239 0 0 1 1.555 7.854 7.202 7.202 0 0 1-2.643 3.234 7.147 7.147 0 0 1-9.049-.896 7.228 7.228 0 0 1-2.103-5.089l.005.001Z" fill="url(#qzGrad)"/>
    </g>
  </g>
