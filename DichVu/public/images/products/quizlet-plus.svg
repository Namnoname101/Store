<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="p_qz_bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#0d1f4d"/>
      <stop offset="100%" stop-color="#02050f"/>
    </radialGradient>
    <radialGradient id="p_qz_halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3CCFCF" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#60a5fa" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#02050f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p_qz_corner" cx="88%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#02050f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p_qz_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.032"/>
    </pattern>
    <linearGradient id="p_qz_pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3CCFCF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="p_qz_qz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3CCFCF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed edge-to-edge backdrop (Zero inner box frame) -->
  <rect width="1200" height="750" fill="url(#p_qz_bg)"/>
  <rect width="1200" height="750" fill="url(#p_qz_grid)"/>
  <rect width="1200" height="750" fill="url(#p_qz_corner)"/>

  <!-- Atmospheric hero spotlight halo -->
  <circle cx="600" cy="240" r="295" fill="url(#p_qz_halo)"/>

  <!-- Enlarged hero brand emblem (Clear of corner overlay zones) -->
  <g transform="translate(600, 240)">
    <g transform="translate(-128, -128) scale(10.66)">
      <path d="M12.779.025a11.789 11.789 0 0 0-5.338.896A11.829 11.829 0 0 0 3.058 4.11 11.928 11.928 0 0 0 .427 14.363a11.92 11.92 0 0 0 2.3 4.921 11.842 11.842 0 0 0 4.24 3.378 11.783 11.783 0 0 0 10.533-.226.327.327 0 0 1 .331.018 9.136 9.136 0 0 0 5.197 1.545.332.332 0 0 0 .332-.332v-4.038a.334.334 0 0 0-.276-.331 4.732 4.732 0 0 1-1.106-.319.329.329 0 0 1-.191-.352.33.33 0 0 1 .05-.133 11.943 11.943 0 0 0 .772-11.871 11.87 11.87 0 0 0-4.042-4.628A11.793 11.793 0 0 0 12.765.018l.013.007h.001ZM4.843 11.898a7.24 7.24 0 0 1 1.205-4.005 7.18 7.18 0 0 1 3.215-2.657 7.133 7.133 0 0 1 7.815 1.558 7.239 7.239 0 0 1 1.555 7.854 7.202 7.202 0 0 1-2.643 3.234 7.147 7.147 0 0 1-9.049-.896 7.228 7.228 0 0 1-2.103-5.089l.005.001Z" fill="url(#p_qz_qz)"/>
    </g>
  </g>

  <!-- Large legible typography safely above bottom badge safe-zone -->
  <g transform="translate(600, 470)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="1.5">QUIZLET PLUS</text>
    <g transform="translate(0, 62)">
      <rect x="-340" y="-28" width="680" height="56" rx="28" fill="url(#p_qz_pillGrad)" stroke="#3CCFCF" stroke-opacity="0.52" stroke-width="1.75"/>
      <text x="0" y="9" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="1">GÓI TEACHER • HỌC TẬP AI</text>
    </g>
  </g>
</svg>