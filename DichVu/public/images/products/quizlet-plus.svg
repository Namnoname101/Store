      <text x="0" y="7" fill="#80e5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="1">
        GÓI TEACHER BẢN QUYỀN • HỌC TẬP THÔNG MINH BẰNG AI
      </text>
