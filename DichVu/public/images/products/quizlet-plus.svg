<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="qzBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#0e1738"/>
      <stop offset="60%" stop-color="#070c1e"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <filter id="qzGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="qzCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="qzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4257B2"/>
      <stop offset="50%" stop-color="#3CCFCF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#qzBg)"/>
  <circle cx="600" cy="270" r="260" fill="#3CCFCF" opacity="0.22" filter="url(#qzGlow)"/>
  <rect x="220" y="75" width="760" height="600" rx="36" fill="url(#qzCard)" stroke="#3CCFCF" stroke-opacity="0.38" stroke-width="1.5"/>

  <!-- Quizlet 'Q' Logo -->
  <g transform="translate(600, 260)">
    <circle cx="0" cy="0" r="115" fill="#091026" stroke="#3CCFCF" stroke-width="2.5" filter="url(#qzGlow)"/>
    <!-- Q Ring -->
    <circle cx="-6" cy="-8" r="48" fill="none" stroke="url(#qzGrad)" stroke-width="14"/>
    <!-- Q Tail / Flashcard Flip -->
    <path d="M18 16 L44 42" stroke="url(#qzGrad)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="44" cy="42" r="5" fill="#00E5FF"/>
  </g>

  <!-- Titles -->
  <g transform="translate(600, 480)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="2">
      QUIZLET PLUS 1 THÁNG
    </text>
    <g transform="translate(0, 52)">
      <rect x="-270" y="-22" width="540" height="44" rx="22" fill="#3CCFCF" fill-opacity="0.18" stroke="#3CCFCF" stroke-width="1.5"/>
      <text x="0" y="7" fill="#80e8e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="1">
        BẢN QUYỀN TEACHER • HỌC TẬP KHÔNG GIỚI HẠN
      </text>
    </g>
  </g>
</svg>
