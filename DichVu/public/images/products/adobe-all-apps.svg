<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="p_acc_bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#2b0709"/>
      <stop offset="100%" stop-color="#050101"/>
    </radialGradient>
    <radialGradient id="p_acc_halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#050101" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p_acc_corner" cx="88%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#050101" stop-opacity="0"/>
