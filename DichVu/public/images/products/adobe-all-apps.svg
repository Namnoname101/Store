    </pattern>
    <linearGradient id="p_acc_pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.16"/>
