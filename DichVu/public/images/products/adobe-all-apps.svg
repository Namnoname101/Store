      <stop offset="28%" stop-color="#3b82f6"/>
      <stop offset="58%" stop-color="#a855f7"/>
      <stop offset="82%" stop-color="#FF007A"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed edge-to-edge backdrop (Zero inner box frame) -->
