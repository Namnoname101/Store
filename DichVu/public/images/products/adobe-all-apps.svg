<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="adBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="55%" stop-color="#140303"/>
      <stop offset="100%" stop-color="#050101"/>
    </radialGradient>
    <filter id="adGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="adCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Official Adobe Creative Cloud Rainbow Spectrum Gradient -->
    <linearGradient id="ccRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="25%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="75%" stop-color="#FF007A"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#adBg)"/>
  <circle cx="600" cy="260" r="270" fill="#FF0000" opacity="0.22" filter="url(#adGlow)"/>
  <rect x="220" y="75" width="760" height="600" rx="36" fill="url(#adCard)" stroke="#FF0000" stroke-opacity="0.38" stroke-width="1.5"/>

  <!-- Top Pill Badges -->
  <g transform="translate(256, 115)">
    <rect width="145" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="24" cy="18" r="6" fill="#FF0000"/>
    <text x="38" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Tài khoản</text>
  </g>
  <g transform="translate(865, 115)">
    <rect width="80" height="36" rx="18" fill="#FA0F00" fill-opacity="0.15" stroke="#FA0F00" stroke-opacity="0.35" stroke-width="1"/>
    <text x="40" y="23" fill="#ff6b6b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">-85%</text>
  </g>

  <!-- ================= AUTHENTIC ADOBE CREATIVE CLOUD LOGO ================= -->
  <g transform="translate(600, 260)">
    <!-- App Tile Outer Glow -->
    <rect x="-110" y="-110" width="220" height="220" rx="48" fill="#130303" stroke="url(#ccRainbow)" stroke-width="2.5" filter="url(#adGlow)"/>
    <rect x="-110" y="-110" width="220" height="220" rx="48" fill="#130303"/>

