<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="suBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#2d0a1e"/>
      <stop offset="55%" stop-color="#14040d"/>
      <stop offset="100%" stop-color="#050104"/>
    </radialGradient>
    <filter id="suGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="suCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="suGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A"/>
      <stop offset="50%" stop-color="#FF5400"/>
      <stop offset="100%" stop-color="#FFBD00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#suBg)"/>
  <circle cx="600" cy="270" r="260" fill="#FF007A" opacity="0.22" filter="url(#suGlow)"/>
  <rect x="220" y="75" width="760" height="600" rx="36" fill="url(#suCard)" stroke="#FF007A" stroke-opacity="0.38" stroke-width="1.5"/>

  <!-- Suno Soundwave Music Logo -->
  <g transform="translate(600, 260)">
    <circle cx="0" cy="0" r="115" fill="#18040f" stroke="url(#suGrad)" stroke-width="2.5" filter="url(#suGlow)"/>
    <!-- Equalizer soundwaves -->
    <rect x="-50" y="-15" width="8" height="30" rx="4" fill="url(#suGrad)"/>
    <rect x="-35" y="-35" width="8" height="70" rx="4" fill="url(#suGrad)"/>
    <rect x="-20" y="-55" width="8" height="110" rx="4" fill="url(#suGrad)"/>
    <rect x="-5" y="-40" width="8" height="80" rx="4" fill="url(#suGrad)"/>
    <rect x="10" y="-60" width="8" height="120" rx="4" fill="url(#suGrad)"/>
    <rect x="25" y="-30" width="8" height="60" rx="4" fill="url(#suGrad)"/>
    <rect x="40" y="-15" width="8" height="30" rx="4" fill="url(#suGrad)"/>
  </g>

  <!-- Titles -->
  <g transform="translate(600, 480)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="2">
      SUNO AI PRO 1 THÁNG
    </text>
    <g transform="translate(0, 52)">
      <rect x="-310" y="-22" width="620" height="44" rx="22" fill="#FF007A" fill-opacity="0.18" stroke="#FF5400" stroke-width="1.5"/>
      <text x="0" y="7" fill="#ff99cc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="1">
        TẠO NHẠC BẢN QUYỀN • 2.500 CREDITS • COMMERCIAL RIGHTS
      </text>
    </g>
  </g>
</svg>
