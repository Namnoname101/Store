<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="claudeBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#24140b"/>
      <stop offset="55%" stop-color="#120904"/>
      <stop offset="100%" stop-color="#060301"/>
    </radialGradient>

    <!-- Terracotta Glow Filter -->
    <filter id="claudeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Accent Linear Gradient -->
    <linearGradient id="claudeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F27A59"/>
      <stop offset="50%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#C25A38"/>
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="claudeCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Micro Tech Grid Pattern -->
    <pattern id="claudeGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D97757" stroke-width="1" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Dark Luxury Background -->
  <rect width="1200" height="750" fill="url(#claudeBg)"/>
  <rect width="1200" height="750" fill="url(#claudeGrid)"/>

  <!-- Ambient Glow Aura -->
  <circle cx="600" cy="270" r="260" fill="#D97757" opacity="0.22" filter="url(#claudeGlow)"/>

  <!-- Card Frame with Terracotta Border -->
  <rect x="220" y="75" width="760" height="600" rx="36" fill="url(#claudeCard)" stroke="#D97757" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Top Generation Chip -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#D97757" fill-opacity="0.15" stroke="#D97757" stroke-width="1"/>
    <text x="0" y="5" fill="#fbd5cb" font-family="'JetBrains Mono', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">
      ANTHROPIC 2026 GENERATION
    </text>
  </g>

  <!-- Hero Logo Container -->
  <g transform="translate(600, 265)">
    <circle cx="0" cy="0" r="115" fill="#150a05" stroke="url(#claudeAccent)" stroke-width="2.5" filter="url(#claudeGlow)"/>
    <circle cx="0" cy="0" r="85" fill="#0c0502" stroke="#D97757" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Anthropic Authentic Asterisk Icon -->
    <g transform="translate(-48, -48) scale(4.0)">
      <path d="M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1.264 1.7-.79 1.36.073.11.188-.02 2.856-.606 1.543-.28 1.841-.315.833.388.091.395-.328.807-1.969.486-2.309.462-3.439.813-.042.03.049.061 1.549.146.662.036h1.622l3.02.225.79.522.474.638-.079.485-1.215.62-1.64-.389-3.829-.91-1.312-.329h-.182v.11l1.093 1.068 2.006 1.81 2.509 2.33.127.578-.322.455-.34-.049-2.205-1.657-.851-.747-1.926-1.62h-.128v.17l.444.649 2.345 3.521.122 1.08-.17.353-.608.213-.668-.122-1.374-1.925-1.415-2.167-1.143-1.943-.14.08-.674 7.254-.316.37-.729.28-.607-.461-.322-.747.322-1.476.389-1.924.315-1.53.286-1.9.17-.632-.012-.042-.14.018-1.434 1.967-2.18 2.945-1.726 1.845-.414.164-.717-.37.067-.662.401-.589 2.388-3.036 1.44-1.882.93-1.086-.006-.158h-.055L4.132 18.56l-1.13.146-.487-.456.061-.746.231-.243 1.908-1.312-.006.006z" fill="url(#claudeAccent)"/>
    </g>
  </g>

  <!-- Product Title & Key Badge -->
  <g transform="translate(600, 480)" text-anchor="middle">
    <!-- Main Title -->
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="2">
      CLAUDE AI &amp; API
    </text>

    <!-- Key Spec Pill - Highlighting 5.5 & 5.6 Generation -->
    <g transform="translate(0, 52)">
      <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#D97757" fill-opacity="0.2" stroke="url(#claudeAccent)" stroke-width="1.5"/>
      <text x="0" y="7" fill="#fbd5cb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="2">
        THẾ HỆ 5.5 &amp; 5.6 • OPUS &amp; SONNET 5.5
      </text>
    </g>

    <!-- Secondary Capability Badges -->
    <g transform="translate(0, 110)">
      <text x="0" y="0" fill="#a89a93" font-family="'JetBrains Mono', -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="2">
        CLAUDE CODE • 1M CONTEXT • EXTENDED REASONING
      </text>
    </g>
  </g>
</svg>
