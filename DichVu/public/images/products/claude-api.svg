<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="p_claude_bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#29140a"/>
      <stop offset="100%" stop-color="#060301"/>
    </radialGradient>
    <radialGradient id="p_claude_halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#fb923c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#060301" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p_claude_corner" cx="88%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#060301" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p_claude_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.032"/>
    </pattern>
    <linearGradient id="p_claude_pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="p_claude_vec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A76"/>
      <stop offset="100%" stop-color="#D97757"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed edge-to-edge backdrop (Zero inner box frame) -->
  <rect width="1200" height="750" fill="url(#p_claude_bg)"/>
  <rect width="1200" height="750" fill="url(#p_claude_grid)"/>
  <rect width="1200" height="750" fill="url(#p_claude_corner)"/>

  <!-- Atmospheric hero spotlight halo -->
  <circle cx="600" cy="240" r="295" fill="url(#p_claude_halo)"/>

