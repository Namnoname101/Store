<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <radialGradient id="prBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1e0c38"/>
      <stop offset="60%" stop-color="#0e041c"/>
      <stop offset="100%" stop-color="#040108"/>
    </radialGradient>
    <filter id="prGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="prCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="prGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#prBg)"/>
  <circle cx="600" cy="270" r="260" fill="#9333EA" opacity="0.22" filter="url(#prGlow)"/>
  <rect x="220" y="75" width="760" height="600" rx="36" fill="url(#prCard)" stroke="#9333EA" stroke-opacity="0.38" stroke-width="1.5"/>

  <!-- Photoroom Door / Cutout Logo -->
  <g transform="translate(600, 260)">
    <circle cx="0" cy="0" r="115" fill="#120624" stroke="#9333EA" stroke-width="2.5" filter="url(#prGlow)"/>
    <!-- Angled Cutout Frames -->
    <rect x="-42" y="-48" width="55" height="75" rx="14" fill="none" stroke="url(#prGrad)" stroke-width="8"/>
    <rect x="-14" y="-28" width="55" height="75" rx="14" fill="#9333EA" fill-opacity="0.3" stroke="#EC4899" stroke-width="6"/>
    <!-- Magic Wand Star Sparkle -->
    <path d="M38 -45 Q38 -30 53 -30 Q38 -30 38 -15 Q38 -30 23 -30 Q38 -30 38 -45 Z" fill="#F472B6"/>
  </g>

  <!-- Titles -->
  <g transform="translate(600, 480)" text-anchor="middle">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="2">
      PHOTOROOM MAX 7 NGÀY
    </text>
    <g transform="translate(0, 52)">
      <rect x="-270" y="-22" width="540" height="44" rx="22" fill="#9333EA" fill-opacity="0.18" stroke="#9333EA" stroke-width="1.5"/>
      <text x="0" y="7" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="1">
        TÁCH NỀN AI • THIẾT KẾ ẢNH BÁN HÀNG PRO
      </text>
    </g>
  </g>
</svg>
