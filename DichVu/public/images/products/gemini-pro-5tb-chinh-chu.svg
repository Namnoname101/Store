<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#10172a" />
      <stop offset="100%" stop-color="#060812" />
    </linearGradient>

    <!-- Gemini Spark Gradient -->
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="35%" stop-color="#9B72CB" />
      <stop offset="70%" stop-color="#D96570" />
      <stop offset="100%" stop-color="#F2994A" />
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for Shadow -->
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="32" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="250" r="220" fill="url(#sparkGlow)" />
  <circle cx="650" cy="180" r="180" fill="url(#amberGlow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Central Left: Gemini AI &amp; Google One Symbol -->
  <g transform="translate(140, 170)">
    <!-- Gemini 4-Point Star Core -->
    <path d="M 0 -85 C 0 -25 25 0 85 0 C 25 0 0 25 0 85 C 0 25 -25 0 -85 0 C -25 0 0 -25 0 -85 Z" fill="url(#geminiGrad)" filter="url(#dropGlow)" />
    <!-- Center white core spark -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Header Badge: Google One 5TB Official -->
  <g transform="translate(320, 95)">
    <rect width="360" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="20" cy="18" r="6" fill="#10b981" />
    <text x="36" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="0.5">GOOGLE ONE • GEMINI PRO OFFICIAL</text>
  </g>

  <!-- Main Headline Title -->
  <g transform="translate(320, 180)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      UP PRO 5TB CHÍNH CHỦ
    </text>
    <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#94a3b8">
      HẠN 12 THÁNG • GÓI KBH
    </text>
  </g>

  <!-- Bento Features Pills -->
  <g transform="translate(320, 260)">
    <!-- Pill 1: 5TB Cloud Storage -->
    <g transform="translate(0, 0)">
      <rect width="200" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">☁️ 5TB (5.000GB) CLOUD</text>
    </g>

    <!-- Pill 2: Gemini 4 Argon &amp; 3.8 Flash -->
    <g transform="translate(215, 0)">
      <rect width="210" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#c084fc">✨ GEMINI 4 ARGON &amp; 3.8</text>
    </g>

    <!-- Pill 3: Nâng Mail Chính Chủ / Add Family -->
    <g transform="translate(0, 54)">
      <rect width="200" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">👥 HỖ TRỢ ADD FAMILY</text>
    </g>

    <!-- Pill 4: Nâng Cấp Nhanh -->
    <g transform="translate(215, 54)">
      <rect width="210" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">⚡ THỦ CÔNG CHU ĐÁO</text>
    </g>
  </g>

  <!-- Price Tag Special 19.000đ -->
  <g transform="translate(320, 395)">
    <rect width="425" height="64" rx="16" fill="#111827" stroke="#4f46e5" stroke-width="1.5" />
    <text x="24" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#9ca3af">GIÁ SIÊU ƯU ĐÃI:</text>
    <text x="170" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#22c55e">19.000đ</text>
    <text x="310" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#64748b" text-decoration="line-through">99.000đ</text>
    <!-- Tag KBH -->
    <rect x="365" y="20" width="46" height="24" rx="6" fill="#ef4444" opacity="0.2" />
    <text x="371" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#f87171">KBH</text>
  </g>
</svg>
